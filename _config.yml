title: "Maggie von Ebers"
author: "Maggie von Ebers"
description: "Cognitive maps, ephemera, etc."
url: "https://mvonebers.com"
baseurl: ""

# Used by jekyll-seo-tag for social cards
twitter_username: "ebervector"
github_username: "mx60s"

permalink: /blog/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

kramdown:
  syntax_highlighter_opts:
    disable: true

# jekyll-titles-from-headings is on by default on GitHub Pages
titles_from_headings:
  strip_title: true
  collections: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      tags: Other

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - Cargo.toml
  - Cargo.lock
  - package.json
  - package-lock.json
  - webpack.config.js
