---
layout: default
---
<article>
  <h1 class="post-title">{{ page.title | escape }}</h1>
  <p class="meta">{{ page.date | date: "%B %-d, %Y" }}</p>
  <div class="post-body">
    {{ content }}
  </div>
  <nav class="post-nav">
    {%- if page.previous.url -%}<a class="prev" href="{{ page.previous.url }}"><small>← older</small>{{ page.previous.title }}</a>{%- endif -%}
    {%- if page.next.url -%}<a class="next" href="{{ page.next.url }}"><small>newer →</small>{{ page.next.title }}</a>{%- endif -%}
  </nav>
</article>
